name: isar_generator
description: Code generator for the Isar Database. Finds classes annotated with @Collection.
version: 3.1.7
repository: https://github.com/isar-community/isar
homepage: https://isar.dev
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  analyzer: ^9.0.0
  build: ^4.0.4
  dart_style: ^3.0.1
  dartx: ^1.1.0
  glob: ^2.0.2
  isar:
    path: ../isar
    # version: 3.1.7
    # hosted: https://pub.isar-community.dev
  path: ^1.8.1
  source_gen: ^4.2.0
  xxh3: ^1.0.1

dev_dependencies:
  build_test: ^3.5.7
  matcher: ^0.12.12
  test: ^1.21.0
  very_good_analysis: ^10.1.0
